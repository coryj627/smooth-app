# a11y-check-flutter — project config (version 1).
#
# Generated by `init`; edit freely — it is never overwritten (only
# `init --force` regenerates it, discarding your edits). Commit it.
#
# Findings carry the engines' built-in severity — error / warning / info —
# mapped onto YOUR scale below for display, for the SARIF level and for
# the CI gate. The generated values are a straight passthrough, so a team
# that never edits this file gets exactly the engines' behaviour.
version: 1

severity:
  # Your labels, MOST severe first. Rename or add labels freely; `defaults`,
  # `fail_at`, `sarif` and every override below must use them.
  scale: [error, warning, info]
  # Where each engine severity lands when no group or rule override applies.
  defaults:
    error: error
    warning: warning
    info: info
  # `scan` exits 1 when a NEW finding at or above this label survives the
  # baseline. The least severe label means ANY new finding fails CI; raising
  # it is a deliberate edit, never something the tool assumes.
  fail_at: info
  # Label -> SARIF level (error | warning | note | none) for code scanning.
  sarif:
    error: error
    warning: warning
    info: note

scan:
  # resolved: full analysis against the repo's own `pub get` (run
  #   `flutter pub get` first) — best recall; what CI should run.
  # fast: parse-only, no dependency resolution; ~10x faster, misses labels
  #   forwarded through wrapper widgets (recall 0.97 vs 1.0 on the scoring
  #   corpus). Fine for pre-commit; `scan --mode fast` overrides per run.
  mode: resolved
  # The runtime report flutter_a11y_test's RuntimeFindingsSink writes during
  # the repo's own `flutter test`; merged into the scan when present (its
  # findings are flutter/runtime/*). Set to false to ignore runtime findings.
  runtime_report: .a11y/flutter/runtime-findings.json

# Rule groups, keyed by WCAG 2.2 guideline (the value findings carry) or
# `best-practice`. Disable a whole group or relabel everything in it:
#   "1.1": { enabled: false }
#   "1.4": { severity: warning }
groups:
  # 1.1 Text Alternatives — 2 rules:
  #   flutter/runtime/image-missing-label
  #   flutter/static/image-missing-label
  # "1.1": {}
  # 1.3 Adaptable — 2 rules:
  #   flutter/runtime/no-heading-on-screen
  #   flutter/static/header-true-noop
  # "1.3": {}
  # 1.4 Distinguishable — 4 rules:
  #   flutter/runtime/content-overflow-at-reflow-width
  #   flutter/runtime/icon-contrast-insufficient
  #   flutter/runtime/text-contrast-insufficient
  #   flutter/runtime/text-overflow-at-scale
  # "1.4": {}
  # 2.1 Keyboard Accessible — 1 rule:
  #   flutter/runtime/button-missing-action
  # "2.1": {}
  # 2.4 Navigable — 4 rules:
  #   flutter/runtime/duplicate-interactive-label
  #   flutter/runtime/hidden-interactive
  #   flutter/runtime/traversal-order-mismatch
  #   flutter/runtime/vague-label
  # "2.4": {}
  # 2.5 Input Modalities — 2 rules:
  #   flutter/runtime/tap-target-below-minimum
  #   flutter/runtime/tap-target-too-small
  # "2.5": {}
  # 3.3 Input Assistance — 3 rules:
  #   flutter/runtime/textfield-missing-label
  #   flutter/runtime/textfield-placeholder-only
  #   flutter/static/textfield-missing-label
  # "3.3": {}
  # 4.1 Compatible — 6 rules:
  #   flutter/runtime/interactive-missing-name
  #   flutter/runtime/interactive-missing-role
  #   flutter/runtime/missing-live-region
  #   flutter/runtime/tap-target-missing-label
  #   flutter/static/gesture-missing-semantics
  #   flutter/static/icon-button-missing-tooltip
  # "4.1": {}

# Per-rule overrides win over the group. Every rule the engines emit, with
# its engine severity, primary WCAG criterion and what it detects:
rules:
  # flutter/runtime/button-missing-action
  #   error · 2.1.1 · Enabled button exposes no tap or long-press action.
  # flutter/runtime/button-missing-action: { enabled: true, severity: error }
  # flutter/runtime/content-overflow-at-reflow-width
  #   error · 1.4.10 · Layout overflows at the reflow width (default 320 logical px).
  # flutter/runtime/content-overflow-at-reflow-width: { enabled: true, severity: error }
  # flutter/runtime/duplicate-interactive-label
  #   warning · 2.4.6 · Sibling interactive nodes share the same label and role.
  # flutter/runtime/duplicate-interactive-label: { enabled: true, severity: warning }
  # flutter/runtime/hidden-interactive
  #   warning · 2.4.3 · Hidden or invisible node is still actionable or focusable.
  # flutter/runtime/hidden-interactive: { enabled: true, severity: warning }
  # flutter/runtime/icon-contrast-insufficient
  #   error · 1.4.11 · Icon contrast against its background is below 3:1.
  # flutter/runtime/icon-contrast-insufficient: { enabled: true, severity: error }
  # flutter/runtime/image-missing-label
  #   error · 1.1.1 · Image node has no label.
  # flutter/runtime/image-missing-label: { enabled: true, severity: error }
  # flutter/runtime/interactive-missing-name
  #   error · 4.1.2 · Interactive node has no accessible name (label, tooltip, value, hint).
  # flutter/runtime/interactive-missing-name: { enabled: true, severity: error }
  # flutter/runtime/interactive-missing-role
  #   error · 4.1.2 · Tappable node exposes no role (not a button, link, field, slider...).
  # flutter/runtime/interactive-missing-role: { enabled: true, severity: error }
  # flutter/runtime/missing-live-region
  #   info · 4.1.3 · Text changed between two pumps without a live region.
  # flutter/runtime/missing-live-region: { enabled: true, severity: info }
  # flutter/runtime/no-heading-on-screen
  #   info · 1.3.1 · Screen shows heading-styled text but no node has headingLevel > 0.
  # flutter/runtime/no-heading-on-screen: { enabled: true, severity: info }
  # flutter/runtime/tap-target-below-minimum
  #   error · 2.5.8 · Tappable node is below the WCAG 2.5.8 minimum (24x24 px) without spacing.
  # flutter/runtime/tap-target-below-minimum: { enabled: true, severity: error }
  # flutter/runtime/tap-target-missing-label
  #   error · 4.1.2 · Tappable node has neither a label nor a tooltip.
  # flutter/runtime/tap-target-missing-label: { enabled: true, severity: error }
  # flutter/runtime/tap-target-too-small
  #   warning · 2.5.5 · Tappable node is smaller than the platform tap-target size (48/44 px).
  # flutter/runtime/tap-target-too-small: { enabled: true, severity: warning }
  # flutter/runtime/text-contrast-insufficient
  #   error · 1.4.3 · Text contrast is below the WCAG minimum (pixel-sampled).
  # flutter/runtime/text-contrast-insufficient: { enabled: true, severity: error }
  # flutter/runtime/text-overflow-at-scale
  #   error · 1.4.4 · Layout overflows when text is scaled (default 200 %).
  # flutter/runtime/text-overflow-at-scale: { enabled: true, severity: error }
  # flutter/runtime/textfield-missing-label
  #   error · 3.3.2 · Text field has neither a label nor a hint.
  # flutter/runtime/textfield-missing-label: { enabled: true, severity: error }
  # flutter/runtime/textfield-placeholder-only
  #   warning · 3.3.2 · Text field is named only by placeholder/hint text.
  # flutter/runtime/textfield-placeholder-only: { enabled: true, severity: warning }
  # flutter/runtime/traversal-order-mismatch
  #   info · 2.4.3 · Screen-reader traversal order differs from visual reading order.
  # flutter/runtime/traversal-order-mismatch: { enabled: true, severity: info }
  # flutter/runtime/vague-label
  #   warning · 2.4.4 · Interactive node label is vague ("click here", "button", ...).
  # flutter/runtime/vague-label: { enabled: true, severity: warning }
  # flutter/static/gesture-missing-semantics
  #   error · 4.1.2 · Tappable gesture widget has no button role or label
  # flutter/static/gesture-missing-semantics: { enabled: true, severity: error }
  # flutter/static/header-true-noop
  #   warning · 1.3.1 · Semantics(header: true) without headingLevel is a no-op on mobile
  # flutter/static/header-true-noop: { enabled: true, severity: warning }
  # flutter/static/icon-button-missing-tooltip
  #   error · 4.1.2 · Icon-only button has no tooltip or labelled icon
  # flutter/static/icon-button-missing-tooltip: { enabled: true, severity: error }
  # flutter/static/image-missing-label
  #   warning · 1.1.1 · Image has no semantic label and is not excluded from semantics
  # flutter/static/image-missing-label: { enabled: true, severity: warning }
  # flutter/static/textfield-missing-label
  #   error · 3.3.2 · Text field has no persistent label (hint-only or none)
  # flutter/static/textfield-missing-label: { enabled: true, severity: error }
